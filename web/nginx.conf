server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # nginx defaults to 1M, well under a multi-receipt chat upload (up to
        # 10 files x 20MB each, per the app's own per-file cap) — raise it so
        # the app's own validation (file count/size/type) is what rejects an
        # oversized request, not a silent nginx 413 the backend never sees.
        client_max_body_size 220M;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # SSE: disable buffering so chat streams
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
